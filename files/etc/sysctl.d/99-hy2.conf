# 99-hy2.conf — Hysteria2/QUIC 系统调优（AP8220 千兆 / K3 通用）
# 构建时放入: <固件仓库>/files/etc/sysctl.d/99-hy2.conf
# 开机由 procd 按文件名顺序自动应用；以 99- 开头确保覆盖发行版默认值

# ---- UDP 缓冲：QUIC/hy2 必备 ----
# quic-go 会尝试把 UDP 收发缓冲提到约 7MB；OpenWrt 默认上限只有 212992，
# 缓冲一满内核就丢包 → hy2 丢包重传、速度上不去。
# 千兆按 16MB 开（内存按需分配，并发连接少，放心开）。
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216

# ---- UDP 内存阈值（千兆） ----
net.ipv4.udp_mem = 4096 8192 16384

# ---- 网卡收包队列 ----
net.core.netdev_max_backlog = 5000

# ---- 连接跟踪（高并发） ----
net.netfilter.nf_conntrack_max = 131072

# ---- BBR：只对 TCP 生效，hy2 本身不受影响 ----
# hy2 的拥塞控制是 quic-go 在用户态实现的 (Brutal/BBR)，与内核 TCP BBR 无关。
# 这里开 BBR + fq 是为了直连 TCP 出站、opkg、LuCI 等 TCP 流量；
# fq 还会 pacing 所有出口包（含 hy2 的 UDP），有助平滑突发。
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# ---- TCP Fast Open（可选，对 hy2 无影响，只加速 TCP 建连） ----
net.ipv4.tcp_fastopen = 3
